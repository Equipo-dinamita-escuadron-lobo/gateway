spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: catalogue
          uri: lb://CATALOGUE
          predicates:
            - Path=/api/accountCatalogue/**, /api/tax/**
            
        - id: enterprises
          uri: lb://ENTERPRISES
          predicates:
            - Path=/api/enterprises/**

        - id: factures
          uri: lb://FACTURES
          predicates:
            - Path=/api/factures/**
          
        - id: products
          uri: lb://PRODUCTS
          predicates:
            - Path=/api/products/**,/api/product-types/**,/api/categories/**,/api/unit-measures/**

        - id: thirds
          uri: lb://THIRDS
          predicates:
            - Path=/api/thirds/**

        - id: keycloak
          uri: lb://KEYCLOAK
          predicates:
            - Path=/api/keycloak/**
        
        - id: stock
          uri: lb://STOCK
          predicates:
            - Path=/api/stock/**

        - id: kardex
          uri: lb://KARDEX
          predicates:
          - Path=/api/kardex/weighted-average/**

        - id: inventorypeps
          uri: lb://INVENTORYPEPS
          predicates:
          - Path=/api/kardex/peps/**  

        - id: config
          uri: lb://CONFIG
          predicates:
          - Path=/api/config/**

        - id: receivableswriteoff
          uri: lb://RECEIVABLESWRITEOFF
          predicates:
          - Path=/api/receivableswriteoff/**

        - id: payments
          uri: lb://PAYMENTS
          predicates:
          - Path=/api/payments/**

          
        - id: auxiliary-book
          uri: lb://AUXILIARY-BOOK
          predicates:
            - Path=/api/auxiliary-books/**
            
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    instance-id: "${spring.application.name}:${random.uuid}"

management:
  endpoint:
    health:
      probes:
        enabled: true
